<nav class="navbar navbar-expand-sm navbar-light fixed-top mb-5 shadow-sm">
    <div class="{% if page.container_class %}{{ page.container_class }}{% else %}container-lg{% endif %}">
        <a class="navbar-brand"><strong>{% include bilingual.html en=site.data.profile.navbar_name cn=site.data.profile.navbar_name_cn %}</strong></a>
        <button class="navbar-toggler" style="font-size: 1em; padding: 0.5em;" type="button" data-toggle="collapse" data-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
            <i class="fas fa-map"></i> <span class="lang-en">Menu</span><span class="lang-cn">菜单</span>
        </button>

        <div class="collapse navbar-collapse" id="navbarResponsive">
            <ul class="navbar-nav ml-auto">
                {% for item in site.data.navigation.pages %}
                <li class="nav-item {% if item.name == page.navbar_title or include.active_page == item.name %}active{% endif %}">
                    <a class="nav-link language-aware-link" href="{{ item.url | relative_url }}">{% include bilingual.html en=item.name cn=item.name_cn %}</a>
                </li>
                {% endfor %}
                <li class="nav-item language-switch-item">
                    <button class="language-switch" type="button" data-language-switch aria-label="Switch language">
                        <i class="fas fa-language" aria-hidden="true"></i>
                        <span class="lang-en">中文</span><span class="lang-cn">EN</span>
                    </button>
                </li>
            </ul>
        </div>
    </div>
</nav>

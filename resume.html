---
layout: default
title: Resume
navbar_title: Resume
---

{% assign resume_url = '/output/pdf/Xinyi_Zhu_Resume.pdf' | relative_url %}

<div class="resume-page">
    <div class="resume-toolbar card border-0 shadow-sm bg-white">
        <div class="card-body d-flex flex-column flex-sm-row align-items-sm-center justify-content-between p-4">
            <div>
                <h1 class="resume-heading">Resume</h1>
                <p class="resume-subtitle mb-0">Xinyi Zhu</p>
            </div>
            <a class="resume-download-button mt-3 mt-sm-0" href="{{ resume_url }}" download="Xinyi_Zhu_Resume.pdf">
                <i class="fas fa-download" aria-hidden="true"></i>
                Download resume
            </a>
        </div>
    </div>

    <div class="resume-viewer-card card border-0 shadow-sm bg-white mt-3">
        <div class="card-body p-2 p-md-3">
            <object class="resume-viewer" data="{{ resume_url }}#view=FitH" type="application/pdf">
                <div class="resume-fallback">
                    <p>Your browser cannot display the embedded PDF.</p>
                    <a href="{{ resume_url }}" target="_blank" rel="noopener noreferrer">Open the resume in a new tab</a>
                </div>
            </object>
        </div>
    </div>
</div>

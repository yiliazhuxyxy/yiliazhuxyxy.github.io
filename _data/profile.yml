short_bio: >-
  <p>
    I am an M.S. student in Information Networking at Carnegie Mellon University with a background in computer science and mechanical engineering. My interests include AI agents, distributed systems, information retrieval, and production software infrastructure.
  </p>
  <p>
    I build reliable intelligent systems across the stack, from LLM-powered tools and retrieval systems to distributed search infrastructure.
  </p>
short_bio_cn: >-
  <p>
    我是卡内基梅隆大学信息网络专业硕士研究生，拥有计算机科学与机械工程背景。我的兴趣方向包括 AI 智能体、分布式系统、信息检索和生产级软件基础设施。
  </p>
  <p>
    我专注于构建可靠的全栈智能系统，涵盖大语言模型工具、检索系统与分布式搜索基础设施。
  </p>


    name_cn: 在 Soar 中评估可扩展的 Q-Learning 替代强化学习方法
    tech: Python, Stable-Baselines3, OpenAI Gym, Soar
    tech_cn: Python、Stable-Baselines3、OpenAI Gym、Soar

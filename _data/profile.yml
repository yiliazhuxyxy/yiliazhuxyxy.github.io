experience:
  - name: ByteDance
    name_cn: 字节跳动
    location: Shanghai, China
    location_cn: 中国上海
    position: AI Agent Backend Engineer Intern
    position_cn: AI Agent后端开发实习生
    date: May 2026 - Aug. 2026
    date_cn: 2026年5月 – 2026年8月
    details:
      - <strong>Built a self-evolving LLM knowledge base</strong> that distilled 10K+ support chats into confidence-scored Q&A by clustering questions and consistent answers, while using human feedback to resolve conflicts and refresh stale knowledge; <strong>recovered 40.1% of unanswered queries and raised useful-response rate from 69.3% to 73.9%</strong>.
      - Extended an <strong>on-call troubleshooting agent</strong> for container-image build failures by developing <strong>scenario-specific SOP-as-code workflows</strong>, refining agent routing and prompts, and integrating build-context tools; increased the <strong>AI contribution score by 15.3% and reduced MTTR by 11.4%</strong>.
      - Designed and launched an <strong>evaluation framework for an LLM-powered on-call assistant</strong>, combining user-adoption signals with LLM-as-a-judge scoring; evaluated 2,900+ response rounds across 1,300+ support chats and surfaced low-quality cases for targeted iteration.
      - Designed and implemented a <strong>Docker Buildx/BuildKit-based WebShell debugging system</strong> that decoupled build execution from user sessions, preserved failed-build root filesystems in a shared debug session, and provided each engineer or AI agent an isolated tmux shell for collaborative troubleshooting.

    details_cn:
      - 设计并上线面向 <strong>LLM Oncall 助手的自动化评估框架</strong>，利用用户采纳信号进行 LLM-as-a-Judge 评分，对 <strong>1,300+ 个 Oncall 会话、2,900+ 轮 Agent 响应</strong>进行质量评估，定位低质量回复与典型失败场景，为 Agent 效果分析及迭代优化提供数据支撑。
      - 面向镜像构建失败场景，设计并实现基于 <strong>SOP-as-Code 的排障 Agent</strong>，将标准化排障流程转化为可执行工作流，优化任务路由、Prompt 编排与构建上下文工具调用，实现多步骤故障诊断与处理；推动 <strong>Agent 有效贡献率提升 15.3%，平均故障恢复时间（MTTR）降低 11.4%</strong>。
      - 设计并构建面向 Oncall Agent 的 <strong>LLM 驱动自进化知识库</strong>，从 10K+ 条历史 Oncall 记录中通过聚类与知识抽取生成高置信问答对，结合人工反馈完成知识冲突消解与过时内容更新；使 Agent <strong>有效回答 40.1% 此前无法处理的问题，整体有效回复率由 69.3% 提升至 73.9%</strong>。

publications:
  - title: "EXP-Bench: Can AI Conduct AI Research Experiments?"
    title_cn: "EXP-Bench: Can AI Conduct AI Research Experiments?"
    venue: International Conference on Learning Representations (ICLR) 2026
    venue_cn: International Conference on Learning Representations (ICLR) 2026
    year: 2025
    authors: "Kon, P. T. J., Liu, J., <strong>Zhu, X.</strong>, Ding, Q., Peng, J., Xing, J., Huang, Y., Qiu, Y., Srinivasa, J., Lee, M., Chowdhury, M., Zaharia, M., & Chen, A."
    citation: "arXiv preprint arXiv:2505.24785"
    description: Contributed to a scalable benchmark that reconstructs executable research tasks from scientific literature to evaluate AI agents on real-world experimentation, including a semi-automated pipeline for extracting experimental procedures, configurations, and evaluation criteria from papers, supplementary materials, and code repositories.
    description_cn: 实现基于 LLM 的自动化科研文档处理流水线，整合论文正文、补充材料及代码仓库，通过 PDF 文本解析与图表信息提取，抽取实验流程、模型配置和评估标准，将科研资料转化为结构化实验信息。设计分阶段的 LLM 任务生成与分析流程，从科研论文中识别可复现的实验目标，进一步提取执行步骤、实验配置与评价要求，支持将真实科研实验转化为可执行的评测任务，用于评估 AI Agent 的自主科研实验能力。
    image: /assets/images/covers/exp-bench-overview.png
    paper: https://arxiv.org/pdf/2505.24785
    code: https://github.com/Just-Curieous/EXP-Bench
    dataset: https://huggingface.co/datasets/Just-Curieous/EXP-Bench

projects:
  - name: Distributed Search Engine
    name_cn: 分布式搜索引擎
    tech: C++, Distributed Systems, Information Retrieval
    tech_cn: C++、分布式系统、信息检索、索引压缩、内存映射、多线程
    date: Jan. 2026 - May 2026
    date_cn: 2026年1月 – 2026年5月
    selected: true
    presentation: /output/pdf/the-ranking-hat-project.pdf
    details:
      - Built a <strong>high-performance C++ indexing pipeline</strong> with compressed inverted indexes using delta and variable-byte encoding, <strong>reducing index storage by 40%</strong>.
      - Distributed indexing and retrieval across <strong>10 nodes</strong> using index sharding, parallel local ranking, and scatter-gather aggregation, scaling to <strong>100M documents</strong> at <strong>over 1M indexed documents per second</strong>.
      - <strong>Ranked 1st among 14 teams</strong> in the capstone showcase for search relevance and retrieval efficiency.
    details_cn:
      - 构建<strong>高性能倒排索引构建流水线</strong>，采用 Delta Encoding 和 Variable-byte Encoding 压缩索引数据，结合分段存储与索引合并机制优化存储效率，<strong>降低索引存储空间 40%</strong>。
      - 设计并实现基于 <strong>10 个节点</strong>的分布式索引与检索系统，通过索引分片、并行查询与结果聚合实现高效分布式检索，<strong>支持亿级文档规模，索引吞吐量超过 100 万篇/秒</strong>。
  - name: "Polaris: Graph-Based Research Index & Retrieval System"
    name_cn: 知识图谱与智能科研检索系统
    tech: Python, Neo4j, Cypher, FAISS
    tech_cn: Python、Neo4j、FAISS、知识图谱、混合检索、AI Agent
    date: May 2025 - Mar. 2026
    date_cn: 2025年5月 – 2026年3月
    selected: true
    details:
      - Built a <strong>Neo4j-based knowledge graph and data ingestion pipeline</strong> representing concepts, methods, and relationships across <strong>60K+ computer science papers</strong>.
      - Developed a <strong>tool-using retrieval agent</strong> that combined Cypher graph queries with vector search and employed <strong>beam-search-guided multi-path reasoning</strong> to identify relevant scientific literature.
    details_cn:
      - 设计并实现面向 <strong>6 万余篇计算机科学论文</strong>的知识提取与索引流水线，基于 Neo4j 构建涵盖研究概念、技术方法及其关联关系的知识图谱，实现科研知识的结构化组织与关联检索。
      - 构建<strong>知识图谱查询与向量语义混合检索的科研 Agent</strong>，通过工具调用动态执行图谱查询与向量搜索，结合 Beam Search 多路径推理优化文献检索效果；<strong>LitSearch Benchmark Recall@20 从 75.3% 提升至 80.2%</strong>。
  - name: Open-domain Scientific Claim Verification
    name_cn: MultiVerS-PICO：医学文献事实验证模型
    tech: Python, PyTorch, Hugging Face Transformers, LoRA
    tech_cn: Python、PyTorch、Longformer、BioELECTRA、LoRA、注意力机制
    date: Sep. 2025 - Dec. 2025
    date_cn: 2025年9月 – 2025年12月
    selected: false
    presentation: /output/posters/multivers-pico-poster.png
    presentation_label: "Architecture, Design & Results"
    presentation_label_cn: 架构、设计与结果
    code: https://github.com/ping-haonan/MultiVerS-PICO
    details:
      - Enhanced MultiVerS with <strong>parameter-efficient LoRA fine-tuning</strong> and <strong>PICO-augmented inputs</strong> for biomedical claim verification.
      - Improved sentence-level rationale extraction on SciFact-Open, achieving <strong>11.52% precision</strong>, <strong>5.62% recall</strong>, and <strong>7.56% F1 gains</strong>.
    details_cn:
      - 基于 <strong>Longformer 与 BioELECTRA-PICO</strong> 构建双路医学文本编码架构，通过 Longformer 联合建模医学声明与论文摘要，结合 BioELECTRA 提取的医学实体表示，利用<strong>注意力机制融合上下文语义与领域知识</strong>，增强模型对医学证据的理解能力。
      - 设计共享表示的<strong>证据句识别与文献立场分类双任务模型</strong>，联合预测关键证据与支持、反驳等分类结果；采用 <strong>LoRA 低秩适配与加权联合损失</strong>进行参数高效训练，降低需要更新的模型参数量。
  - name: GPT Reproduction
    name_cn: GPT 模型复现与训练优化
    tech: Python, PyTorch, Mixed Precision, Distributed Training
    tech_cn: Python、PyTorch、Transformer、混合精度训练、分布式训练
    date: Oct. 2025 - Nov. 2025
    date_cn: 2025年10月 – 2025年11月
    selected: false
    details:
      - Implemented a <strong>GPT-style decoder model with 60M parameters</strong> and conducted pretraining on the FineWeb dataset, followed by supervised fine-tuning on SmolTalk to enable dialogue capability.
      - Achieved a basic chatbot capable of coherent dialogue after <strong>15-hour pretraining</strong> and <strong>4-hour fine-tuning</strong>.
    details_cn:
      - 基于 <strong>PyTorch</strong> 从零实现约 <strong>6,000 万参数的 GPT 风格 Transformer 解码器模型</strong>，搭建完整的模型训练流水线，使用 <strong>FineWeb 数据集进行预训练</strong>，并基于 <strong>SmolTalk 数据集完成监督微调（SFT）</strong>。
      - 采用<strong>混合精度训练、梯度累积与多 GPU 分布式训练</strong>优化训练流程，在降低显存开销的同时支持更大批量训练，提升模型训练效率与资源利用率。
  - name: Advanced Operating Systems
    name_cn: 操作系统
    tech: C++, Boost, TCP/IP
    tech_cn: C++、Boost、TCP/IP、虚拟内存、并发同步
    date: Jan. 2025 - May 2025
    date_cn: 2025年1月 – 2025年5月
    selected: true
    details:
      - Implemented a <strong>single-CPU user-level thread library</strong> using ucontext, with FIFO scheduling, timer-interrupt preemption, thread joins, mutexes, and condition variables.
      - Built a <strong>demand-paged virtual memory manager</strong> supporting swap-backed and file-backed pages, clock-based eviction, dirty/reference tracking, eager swap reservation, and copy-on-write from a pinned zero page.
      - Built a <strong>multithreaded TCP RPC file server</strong> supporting hierarchical path traversal and concurrent file creation, deletion, reading, and writing, with inode-level shared/exclusive locking and synchronized free-block allocation.
    details_cn:
      - 基于 ucontext 实现<strong>单 CPU 用户级线程库</strong>，支持 FIFO 调度、定时器中断驱动的抢占式调度、线程创建与 Join，以及互斥锁和条件变量。
      - 设计并实现<strong>按需分页虚拟内存管理器</strong>，支持文件映射与匿名内存管理，采用 Clock 页面置换算法优化物理内存分配，并通过 Copy-on-Write 减少不必要的内存开销。
      - 基于 TCP/IP、Boost 实现<strong>多线程远程文件服务器</strong>，支持层级目录管理、文件创建、删除、读取和写入；通过文件节点级读写锁、路径遍历加锁与空闲磁盘块同步分配实现细粒度并发控制，保障文件系统数据一致性。
  - name: Evaluating Scalable RL Alternatives to Q-Learning in Soar
    name_cn: 在 Soar 中评估可扩展的 Q-Learning 替代强化学习方法
    tech: Python, Stable-Baselines3, OpenAI Gym, Soar
    tech_cn: Python、PyTorch、Stable-Baselines3、OpenAI Gym、Soar、强化学习
    date: Nov. 2024 - May 2025
    date_cn: 2024年11月 – 2025年5月
    selected: false
    presentation: /output/posters/explorecs-rl-poster.png
    presentation_label: "Architecture, Design & Results"
    presentation_label_cn: 架构、设计与结果
    code: https://github.com/Center-for-Integrated-Cognition/hybrid-discrete-continuous-RL
    video: https://www.youtube.com/watch?v=wS2sKQ1Quu8
    details:
      - Implemented <strong>DQN/PPO/A2C variants</strong> for symbolic-continuous integration in the Soar architecture.
      - Evaluated performance across <strong>CartPole and LunarLander</strong>, identifying effects of environment complexity and state discretization.
      - Presented at the <strong>45th Soar Workshop</strong>.
    details_cn:
      - 针对 <strong>Soar 认知架构中 Q-Learning 在混合离散与连续状态空间下的可扩展性问题</strong>，研究并实验对比 <strong>DQN、PPO、A2C</strong> 等强化学习算法，探索替代传统 Q-Learning 的可行方案。
      - 基于 <strong>CartPole 与 LunarLander</strong> 环境，设计不同状态离散化粒度的对照实验，分析<strong>状态空间规模、环境复杂度与训练效率</strong>对算法收敛速度和奖励表现的影响，识别不同算法在训练稳定性与可扩展性方面的局限。

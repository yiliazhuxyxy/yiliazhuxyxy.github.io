short_bio: >-
  <p>
    I am an M.S. student in Information Networking at Carnegie Mellon University, focused on building production-ready AI agent systems and AI-powered applications.
  </p>
  <p>
    My experience spans agentic workflows, agent evaluation, knowledge and retrieval systems, and backend infrastructure. I enjoy working across the stack—from designing agent workflows and retrieval pipelines to building scalable services—with a focus on making intelligent systems practical, measurable, reliable, and ready for real-world deployment.
  </p>
short_bio_cn: >-
  <p>
    我是卡内基梅隆大学 Information Networking 硕士研究生，主要关注 AI Agent 系统和 AI 应用的开发。
  </p>
  <p>
    我的经历包括 Agent Workflow、Agent Evaluation、知识与检索系统以及后端基础设施。相比单纯把模型能力接进应用，我更关注整个系统在真实场景里的表现，比如结果是否可靠、系统是否稳定，以及能不能通过评估和迭代持续提升效果。
  </p>


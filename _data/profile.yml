projects:
  - name: Distributed Search Engine
    name_cn: 分布式搜索引擎
    tech: C++, Distributed Systems, Information Retrieval
    tech_cn: C++、分布式系统、信息检索
    date: Jan. 2026 - May 2026
    date_cn: 2026年1月 – 2026年5月
    selected: true
    presentation: /output/pdf/the-ranking-hat-project.pdf
    details:
      - Built a <strong>high-performance C++ indexing pipeline</strong> with compressed inverted indexes using delta and variable-byte encoding, <strong>reducing index storage by 40%</strong>.
      - Distributed indexing and retrieval across <strong>10 nodes</strong> using index sharding, parallel local ranking, and scatter-gather aggregation, scaling to <strong>100M documents</strong> at <strong>over 1M indexed documents per second</strong>.
      - <strong>Ranked 1st among 14 teams</strong> in the capstone showcase for search relevance and retrieval efficiency.
    details_cn:
      - 构建<strong>高性能 C++ 索引流水线</strong>，使用差分编码与变长字节编码压缩倒排索引，<strong>索引存储空间减少 40%</strong>。
      - 利用索引分片、并行本地排序和 scatter-gather 聚合，在 <strong>10 个节点</strong>上实现分布式索引与检索，扩展至 <strong>1 亿篇文档</strong>，索引速度<strong>超过每秒 100 万篇文档</strong>。
      - 在毕业设计项目中，搜索相关性与检索效率<strong>位列 14 支团队第 1 名</strong>。
  - name: "Polaris: Graph-Based Research Index & Retrieval System"
    name_cn: "Polaris：基于图的科研索引与检索系统"
    tech: Python, Neo4j, Cypher, FAISS
    tech_cn: Python、Neo4j、Cypher、FAISS
    date: May 2025 - Mar. 2026
    date_cn: 2025年5月 – 2026年3月
    selected: true
    details:
      - Built a <strong>Neo4j-based knowledge graph and data ingestion pipeline</strong> representing concepts, methods, and relationships across <strong>60K+ computer science papers</strong>.
      - Developed a <strong>tool-using retrieval agent</strong> that combined Cypher graph queries with vector search and employed <strong>beam-search-guided multi-path reasoning</strong> to identify relevant scientific literature.
    details_cn:
      - 使用 <strong>Neo4j 构建科研论文知识图谱</strong>。
      - 设计论文数据入库与关系生成流程，覆盖<strong>6 万余篇计算机科学论文</strong>。
      - 结合图结构查询与向量检索，通过 <strong>Beam Search 引导的多路径搜索</strong>，调用工具选取最优科研资料。

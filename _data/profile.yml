      - 在 MultiVerS 模型基础上引入 <strong>LoRA 参数高效微调</strong>，降低训练成本并提升模型适应性。
      - 设计基于 <strong>PICO 结构</strong>的输入方式，增强模型对医学论断关键要素的理解。
      - 成果：在 SciFact-Open 数据集上提升句级论据抽取性能（<strong>Precision +11.52%，Recall +5.62%，F1 +7.56%</strong>）。

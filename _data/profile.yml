experience:
  - name: ByteDance
    name_cn: 字节跳动
    location: Shanghai, China
    location_cn: 中国上海
    position: AI Agent Backend Engineer Intern
    position_cn: AI Agent后端开发实习生
    date: May 2026 - Aug. 2026
    date_cn: 2026年5月 – 2026年8月
    details:
      - Designed and launched an evaluation framework for an LLM-powered on-call assistant, combining user-adoption signals with LLM-as-a-judge scoring; evaluated 2,900+ response rounds across 1,300+ support chats and surfaced low-quality cases for targeted iteration.
      - Designed and implemented a Docker Buildx/BuildKit-based WebShell debugging system that decoupled build execution from user sessions, preserved failed-build root filesystems in a shared debug session, and provided each engineer or AI agent an isolated tmux shell for collaborative troubleshooting.
      - Extended a multi-agent on-call troubleshooting system for container-image build failures by developing scenario-specific SOP-as-code workflows, refining agent routing and prompts, and integrating build-context tools; increased the AI contribution score by 15.3% and reduced MTTR by 11.4%.
      - Built a self-evolving LLM knowledge base that distilled 10K+ support chats into confidence-scored Q&A by clustering questions and consistent answers, while using human feedback to resolve conflicts and refresh stale knowledge; recovered 40.1% of unanswered queries and raised useful-response rate from 69.3% to 73.9%.
    details_cn:
      - 设计并上线 智能编译Oncall助手 的评估框架，结合用户反馈信号与 LLM-as-a-judge 评分；评估 <strong>1,300+ 个支持会话中的 2,900+ 轮回复</strong>，并定位低质量案例以支持定向迭代。
      - 设计并实现基于 Docker Buildx/BuildKit 的 WebShell 调试系统，将构建执行与用户会话解耦，在共享调试会话中保留失败构建的根文件系统，并为每位工程师或 AI Agent 提供隔离的 tmux shell。
      - 扩展面向容器镜像构建失败的 Multi-Agent oncall 排障系统，开发场景化 SOP-as-code 工作流、优化 Agent 路由与 Prompt 并集成构建上下文工具；<strong>AI 贡献评分提升 15.3%，MTTR 降低 11.4%</strong>。
      - 构建自演进 LLM 知识库，通过聚类问题及一致答案，将 <strong>10K+ 支持会话</strong>提炼为带置信度的问答，并利用人工反馈解决冲突、更新过时知识；<strong>召回 40.1% 的未回答问题，有效回复率从 69.3% 提升至 73.9%</strong>。

